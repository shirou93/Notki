<!doctype html>
<html>
<head>
<style>
  * { box-sizing: border-box; }
  body { background: #173c32; color: white; display: flex; gap: 50px; padding: 50px; align-items: center; }
  .brand-mark { width: 22px; height: 22px; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 3px; transform: rotate(-8deg); }
  .brand-mark span { border: 1.7px solid #52734c; border-radius: 3px; }
  .brand-mark span:first-child { grid-row: span 2; }
</style>
</head>
<body>
  <div class="brand-mark"><span></span><span></span><span></span></div>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
    <g transform="rotate(-8 12 12)" fill="none" stroke="#52734c" stroke-width="1.8">
      <rect x="2.5" y="2.5" width="8" height="19" rx="2" />
      <rect x="13.5" y="2.5" width="8" height="8" rx="2" />
      <rect x="13.5" y="13.5" width="8" height="8" rx="2" />
    </g>
  </svg>
</body>
</html>
