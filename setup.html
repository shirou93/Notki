<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141c17" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Notki — a private notebook in your browser." data-i18n-content="meta.description">
  <title data-i18n="meta.setupTitle">First-time setup — Notki</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <script src="translations/pl.js" defer></script>
  <script src="translations/en.js" defer></script>
  <script src="translations/de.js" defer></script>
  <script src="translations/fr.js" defer></script>
  <script src="translations/ja.js" defer></script>
  <script src="translations/ko.js" defer></script>
  <script src="translations/it.js" defer></script>
  <script src="translations/es.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="theme.js" defer></script>
  <script src="setup.js" defer></script>
</head>
<body>
  <section class="auth-view">
    <div class="auth-content">
      <a class="brand auth-brand" href="/" aria-label="Notki" data-i18n-aria-label="brand.aria"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span><span>notki<span class="brand-period">.</span></span></a>
      <p class="eyebrow" data-i18n="setup.eyebrow">FIRST RUN</p>
      <h1><span data-i18n="setup.heading">Create administrator</span><span class="heading-period">.</span></h1>
      <p class="auth-description" data-i18n="setup.description">This account will manage users, invitations, and server statistics.</p>
      <label class="field-label" for="setup-token" data-i18n="setup.tokenLabel">SETUP TOKEN</label>
      <input class="auth-input" id="setup-token" type="text" autocomplete="off" spellcheck="false" required aria-describedby="setup-token-hint">
      <small class="setup-hint" id="setup-token-hint" data-i18n="setup.tokenHint">Paste the one-time token printed in the server console when Notki started.</small>
      <div class="auth-controls">
        <label class="language-picker"><span class="sr-only" data-i18n="language.label">Language</span><select id="language-select" data-language-select aria-label="Change language" data-i18n-aria-label="language.switch"><option value="pl">Polski</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="it">Italiano</option><option value="es">Español</option></select></label>
      </div>
      <p class="auth-message" id="setup-message" role="alert" hidden></p>
      <form class="auth-form" id="setup-form">
        <label class="field-label" for="setup-email" data-i18n="auth.email">E-MAIL</label>
        <input class="auth-input" id="setup-email" type="email" autocomplete="username" required maxlength="254">
        <label class="field-label" for="setup-password" data-i18n="auth.password">PASSWORD</label>
        <input class="auth-input" id="setup-password" type="password" autocomplete="new-password" required minlength="12" aria-describedby="password-hint">
        <small class="setup-hint" id="password-hint" data-i18n="setup.passwordHint">At least 12 characters.</small>
        <label class="field-label" for="setup-confirm" data-i18n="auth.confirmPassword">CONFIRM PASSWORD</label>
        <input class="auth-input" id="setup-confirm" type="password" autocomplete="new-password" required minlength="12">
        <button class="button-primary" type="submit" data-i18n="setup.submit">Create administrator account</button>
      </form>
    </div>
  </section>
</body>
</html>
